---
name: Validate

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check layout
        # DavidAnson/markdownlint-cli2-action v24.2.0
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'

      # Link checking runs once for a pull request, inside `canonical`'s
      # `bash scripts/validate` -- that step runs the identical
      # `lychee --config lychee.toml` invocation, so a second one here checked
      # nothing this job's sibling did not already check, twice, on every
      # pull request.

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint the shell
        # The set is derived, not listed -- see scripts/validate's identical
        # derivation for why a listed set is one script away from being wrong
        # and silent about it.
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(
            git ls-files | while IFS= read -r candidate; do
              case "${candidate}" in
                *.sh | *.bats)
                  printf '%s\n' "${candidate}"
                  continue
                  ;;
              esac
              [ -f "${candidate}" ] || continue
              IFS= read -r shebang <"${candidate}" || shebang=''
              case "${shebang}" in
                '#!'*[\ /]bash* | '#!'*[\ /]sh | '#!'*[\ /]sh\ *)
                  printf '%s\n' "${candidate}"
                  ;;
              esac
            done
          )
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo 'shellcheck found no shell files to lint, which cannot be right' >&2
            exit 1
          fi
          shellcheck -- "${shell_files[@]}"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Lint the workflows
        # A workflow is the shortest path from a pull request to a token, and
        # agents edit workflows constantly. See standards/security.md.
        run: |
          set -euo pipefail
          python -m pip install 'zizmor==1.29.0'
          zizmor --persona=regular .github/workflows/

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose

  canonical:
    name: Canonical validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Install locked dependencies
        run: npm ci

      # scripts/validate refuses rather than skipping when a tool it needs is
      # absent, so this job installs the same external tools a developer
      # installs locally. markdownlint-cli2 comes from npm ci above, pinned
      # exact in package.json/package-lock.json; lychee and gitleaks are
      # pinned the same way, by exact version and checksum. Downloads and
      # extraction land in RUNNER_TEMP, not the checkout, because
      # scripts/validate's own lychee and gitleaks steps scan `.` -- a loose
      # archive or binary sitting in the checkout would land inside their
      # scope.
      #
      # The two archives are laid out differently: gitleaks' tarball has its
      # binary at the archive root, but lychee's nests it inside a
      # `lychee-x86_64-unknown-linux-gnu/` directory alongside a README and
      # docs -- `tar -xzf ... lychee` (the pattern that works for gitleaks)
      # fails to find that member. Don't copy one step into the other without
      # checking `tar -tzf` against the actual release asset first.
      - name: Install lychee
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: >-
            1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lychee.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "${RUNNER_TEMP}" --strip-components=1 \
            lychee-x86_64-unknown-linux-gnu/lychee
          sudo mv "${RUNNER_TEMP}/lychee" /usr/local/bin/lychee

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "${RUNNER_TEMP}" gitleaks
          sudo mv "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks

      # The one command a developer runs locally, run the same way here, so it
      # cannot drift from what this job checks. shellcheck ships on the
      # ubuntu-24.04 runner image already.
      - name: Run canonical validation
        run: bash scripts/validate
