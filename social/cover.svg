<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-labelledby="title description">
  <title id="title">Lousy Deal social media cover</title>
  <desc id="description">A receipt ledger states: item, nothing; price, five dollars; value, zero dollars; return, minus one hundred percent.</desc>
  <rect width="2560" height="1440" fill="#fafaf7"/>
  <g font-family="IBM Plex Mono, monospace">
    <text x="560" y="574" fill="#141412" font-size="72" font-weight="700" textLength="630" lengthAdjust="spacing">LOUSYDEAL.COM</text>
    <line x1="560" y1="610" x2="2000" y2="610" stroke="#141412" stroke-width="3"/>
    <g fill="#6b6b66" font-size="42" font-weight="700">
      <text x="560" y="682" textLength="112" lengthAdjust="spacing">ITEM</text>
      <text x="560" y="754" textLength="140" lengthAdjust="spacing">PRICE</text>
      <text x="560" y="826" textLength="140" lengthAdjust="spacing">VALUE</text>
      <text x="560" y="898" textLength="168" lengthAdjust="spacing">RETURN</text>
    </g>
    <g stroke="#6b6b66" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 14">
      <line x1="785" y1="672" x2="1610" y2="672"/>
      <line x1="785" y1="744" x2="1610" y2="744"/>
      <line x1="785" y1="816" x2="1610" y2="816"/>
      <line x1="785" y1="888" x2="1610" y2="888"/>
    </g>
    <g fill="#141412" font-size="48" font-weight="700" text-anchor="end">
      <text x="2000" y="682">NOTHING</text>
      <text x="2000" y="754">$5.00</text>
      <text x="2000" y="826">$0.00</text>
      <text x="2000" y="898" fill="#b3261e">-100%</text>
    </g>
  </g>
</svg>
