<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-labelledby="title description">
  <title id="title">Lousy Deal social media cover</title>
  <desc id="description">A receipt ledger states: item, nothing; price, five dollars; value, zero dollars; return, minus one hundred percent.</desc>
  <defs>
    <style>
      @font-face { font-family: "IBM Plex Mono"; src: url("../storefront/public/fonts/IBMPlexMono-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "IBM Plex Mono"; src: url("../storefront/public/fonts/IBMPlexMono-Bold.ttf"); font-weight: 700; }
    </style>
  </defs>
  <rect width="2560" height="1440" fill="#fafaf7"/>
  <g font-family="IBM Plex Mono, monospace">
    <text x="560" y="562" fill="#141412" font-size="72" font-weight="700" textLength="630" lengthAdjust="spacing">LOUSYDEAL.COM</text>
    <text x="560" y="612" fill="#6b6b66" font-size="20">PURVEYORS OF OBJECTIVELY BAD VALUE</text>
    <line x1="560" y1="644" x2="2000" y2="644" stroke="#141412" stroke-width="3"/>
    <g fill="#6b6b66" font-size="42" font-weight="700">
      <text x="560" y="704" textLength="112" lengthAdjust="spacing">ITEM</text>
      <text x="560" y="772" textLength="140" lengthAdjust="spacing">PRICE</text>
      <text x="560" y="840" textLength="140" lengthAdjust="spacing">VALUE</text>
      <text x="560" y="908" textLength="168" lengthAdjust="spacing">RETURN</text>
    </g>
    <g stroke="#6b6b66" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 14">
      <line x1="785" y1="694" x2="1610" y2="694"/>
      <line x1="785" y1="762" x2="1610" y2="762"/>
      <line x1="785" y1="830" x2="1610" y2="830"/>
      <line x1="785" y1="898" x2="1610" y2="898"/>
    </g>
    <g fill="#141412" font-size="48" font-weight="700" text-anchor="end">
      <text x="2000" y="704">NOTHING</text>
      <text x="2000" y="772">$5.00</text>
      <text x="2000" y="840">$0.00</text>
      <text x="2000" y="908" fill="#b3261e">-100%</text>
    </g>
  </g>
</svg>
